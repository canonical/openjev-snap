name: cpu
summary: CPU engine
description: General CPU engine for x64 and ARM (armv8, armv9) CPUs, using llama.cpp
vendor: Canonical Ltd
devices:
  anyof:
    - type: cpu
      architecture: amd64
    - type: cpu
      architecture: arm64

runtime: llamacpp

model:
  default: openjev-27b
  options:
    - openjev-27b

configurations:
  sleep-idle-seconds: 600
  min-context-size: 4096
