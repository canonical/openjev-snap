name: amd-gpu
summary: AMD GPU engine
description: |
  ROCm-enabled GPU acceleration for AMD GPUs, using llama.cpp.
  Targets the microarchitectures the llama.cpp ROCm build is compiled for.
vendor: Canonical Ltd
devices:
  allof:
    - type: cpu
      architecture: amd64
  anyof:
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1010
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1011
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1012
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1030
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1031
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1032
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1100
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1101
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1102
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1150
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1151
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1152
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1153
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1200
      vram: 20G
    - type: gpu
      vendor-id: 0x1002 # AMD Corporation
      microarchitecture: gfx1201
      vram: 20G

runtime: llamacpp-rocm

model:
  default: 27b-q4-k-m-gguf
  options:
    - 27b-q4-k-m-gguf

configurations:
  sleep-idle-seconds: 600
